name: Release

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Immutable source tag, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      SKIP_OPTIONAL_MODELS: "1"
      RELEASE_CHANNEL_OWNER: ${{ github.repository_owner }}
      RELEASE_CHANNEL_REPO: ${{ github.event.repository.name }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ secrets.SOURCE_REPOSITORY }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          ref: ${{ inputs.source_ref }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          lfs: true

      - name: Fetch binary assets
        shell: pwsh
        working-directory: source
        env:
          READ_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          $raw = "x-access-token:$env:READ_TOKEN"
          $credential = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($raw))
          $githubUrl = "url.https://github.com/.insteadOf=git@github.com:"
          $authHeader = "http.https://github.com/.extraheader=AUTHORIZATION: basic $credential"
          git -c $githubUrl -c $authHeader submodule update --init --recursive *> "$env:RUNNER_TEMP/assets.log"
          if ($LASTEXITCODE -ne 0) { throw "Binary asset checkout failed" }
          git -c $githubUrl -c $authHeader submodule foreach --recursive "git lfs pull" *> "$env:RUNNER_TEMP/assets.log"
          if ($LASTEXITCODE -ne 0) { throw "Binary asset download failed" }

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.28.2

      - name: Set up Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Verify version
        shell: pwsh
        working-directory: source
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          if ($env:SOURCE_REF -notmatch '^v?\d+\.\d+\.\d+$') {
            throw "Release ref must be a semantic version tag"
          }
          git show-ref --verify --quiet "refs/tags/$env:SOURCE_REF"
          if ($LASTEXITCODE -ne 0) { throw "Release ref is not a tag" }
          $expected = $env:SOURCE_REF.TrimStart("v")
          $actual = node -p "require('./package.json').version"
          if ($actual -ne $expected) {
            throw "Tag and package version do not match"
          }

      - name: Install dependencies
        id: install_dependencies
        shell: pwsh
        working-directory: source
        run: |
          pnpm run install:win -- --frozen-lockfile *> "$env:RUNNER_TEMP/install.log"
          if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed" }

      - name: Classify dependency failure
        if: failure() && steps.install_dependencies.outcome == 'failure'
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "install.log"
          if (-not (Test-Path $logPath)) {
            Write-Output "diagnostic-categories=install-log-missing"
            Write-Output "diagnostic-components=none"
            Write-Output "diagnostic-dependencies=none"
            Write-Output "diagnostic-codes=none"
            exit 0
          }
          $log = Get-Content $logPath -Raw
          $rules = [ordered]@{
            "pnpm-lockfile" = "ERR_PNPM_(?:LOCKFILE|OUTDATED_LOCKFILE|BROKEN_LOCKFILE)"
            "resource-compiler" = "LNK1158"
            "msbuild" = "MSB\d{4}"
            "compiler" = "(?:fatal )?error C\d{4}"
            "linker" = "LNK\d{4}"
            "cmake" = "CMake Error|CMAKE_(?:C|CXX)_COMPILER"
            "cmake-generator" = "Could not create named generator|generator.+not available"
            "visual-studio" = "Could not find.+Visual Studio|No compatible version of Visual Studio|gyp ERR!.+find VS"
            "windows-sdk" = "Windows SDK.+(?:not found|not installed)|KitsRoot"
            "node-gyp" = "gyp ERR!"
            "node-module" = "Cannot find module"
            "permissions" = "EPERM|EACCES|Cannot create symbolic link"
            "missing-file" = "ENOENT|No such file or directory"
            "network" = "ETIMEDOUT|ECONNRESET|ECONNREFUSED|Failed to download|HTTP [45]\d{2}"
            "network-tls" = "SELF_SIGNED_CERT_IN_CHAIN|UNABLE_TO_VERIFY_LEAF_SIGNATURE|CERT_HAS_EXPIRED|certificate has expired"
            "native-prebuild" = "No prebuilt binaries|Unsupported platform"
          }
          $categories = @($rules.GetEnumerator() | Where-Object { $log -match $_.Value } | ForEach-Object { $_.Key })
          if ($categories.Count -eq 0) { $categories = @("unclassified") }
          $componentMarkers = [ordered]@{
            "project-native" = @("src_native", "cmake-js")
            "electron-runtime" = @("electron")
            "javascript-bundler" = @("esbuild")
            "image-runtime" = @("sharp")
            "audio-runtime" = @("naudiodon2")
          }
          $componentPositions = @($componentMarkers.GetEnumerator() | ForEach-Object {
            $position = -1
            foreach ($marker in $_.Value) {
              $candidate = $log.LastIndexOf($marker, [StringComparison]::OrdinalIgnoreCase)
              if ($candidate -gt $position) { $position = $candidate }
            }
            [PSCustomObject]@{ Name = $_.Key; Position = $position }
          } | Where-Object { $_.Position -ge 0 } | Sort-Object Position -Descending)
          $components = if ($componentPositions.Count -gt 0) { @($componentPositions[0].Name) } else { @("unknown") }
          $dependencyRules = [ordered]@{
            "crypto" = "openssl(?:[\\/]|\.h|_static)"
            "node-api" = "node-addon-api|node_api\.h|(?:^|[\\/])napi\.h"
            "async-io" = "asio(?:[\\/]|\.hpp)|asio_net"
            "database" = "sqlite(?:3|_orm)?(?:[\\/]|\.h)"
            "spreadsheet" = "xlnt(?:[\\/]|\.h|\.hpp)"
            "windows-sdk" = "(?:windows|Wbemidl|ntddscsi|processthreadsapi)\.h"
            "standard-library" = "cannot open include file:\s*'(?:format|ranges|span|source_location|coroutine)'"
          }
          $dependencies = @($dependencyRules.GetEnumerator() | Where-Object { $log -match $_.Value } | ForEach-Object { $_.Key })
          if ($dependencies.Count -eq 0) { $dependencies = @("unknown") }
          $codes = @([regex]::Matches($log, "(?i)\b(?:ERR_PNPM_[A-Z_]+|LNK\d{4}|MSB\d{4}|C\d{4}|ELIFECYCLE|E(?:PERM|ACCES|NOENT|TIMEDOUT|CONNRESET|CONNREFUSED)|SELF_SIGNED_CERT_IN_CHAIN|UNABLE_TO_VERIFY_LEAF_SIGNATURE|CERT_HAS_EXPIRED)\b") | ForEach-Object { $_.Value.ToUpperInvariant() } | Sort-Object -Unique)
          if ($codes.Count -eq 0) { $codes = @("none") }
          Write-Output "diagnostic-categories=$($categories -join ',')"
          Write-Output "diagnostic-components=$($components -join ',')"
          Write-Output "diagnostic-dependencies=$($dependencies -join ',')"
          Write-Output "diagnostic-codes=$($codes -join ',')"

      - name: Build Windows release
        id: build_windows_release
        shell: pwsh
        working-directory: source
        run: |
          pnpm run build:win -- --publish never *> "$env:RUNNER_TEMP/build.log"
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }
          $assets = Get-ChildItem -Path release -Recurse -File | Where-Object {
            $_.Name -eq "latest.yml" -or $_.Name -like "client-win-x64-*.exe" -or $_.Name -like "*.blockmap"
          }
          if (-not $assets) { throw "Release artifacts are missing" }

      - name: Classify build failure
        if: failure() && steps.build_windows_release.outcome == 'failure'
        shell: pwsh
        run: |
          $logPath = Join-Path $env:RUNNER_TEMP "build.log"
          if (-not (Test-Path $logPath)) {
            Write-Output "build-diagnostic-categories=build-log-missing"
            Write-Output "build-diagnostic-components=none"
            Write-Output "build-diagnostic-signatures=none"
            Write-Output "build-diagnostic-error-tokens=none"
            Write-Output "build-diagnostic-codes=none"
            exit 0
          }
          $log = Get-Content $logPath -Raw
          $rules = [ordered]@{
            "packager" = "electron-builder|app-builder"
            "installer" = "makensis|NSIS"
            "signing" = "winCodeSign|code.?sign|certificate"
            "javascript-bundler" = "vite|esbuild"
            "native-rebuild" = "@electron/rebuild|rebuild native|install-app-deps"
            "node-gyp" = "gyp ERR!"
            "cmake" = "CMake Error|CMAKE_(?:C|CXX)_COMPILER"
            "visual-studio" = "Could not find.+Visual Studio|No compatible version of Visual Studio|gyp ERR!.+find VS"
            "compiler" = "(?:fatal )?error C\d{4}"
            "linker" = "LNK\d{4}"
            "node-module" = "Cannot find module"
            "permissions" = "EPERM|EACCES|Cannot create symbolic link|required privilege"
            "missing-file" = "ENOENT|No such file or directory|cannot find the (?:file|path)"
            "path-length" = "path too long|filename or extension is too long"
            "disk-space" = "ENOSPC|no space left on device"
            "out-of-memory" = "heap out of memory|not enough memory"
            "network" = "ETIMEDOUT|ECONNRESET|ECONNREFUSED|Failed to download|HTTP [45]\d{2}"
            "network-tls" = "SELF_SIGNED_CERT_IN_CHAIN|UNABLE_TO_VERIFY_LEAF_SIGNATURE|CERT_HAS_EXPIRED|certificate has expired"
          }
          $categories = @($rules.GetEnumerator() | Where-Object { $log -match $_.Value } | ForEach-Object { $_.Key })
          if ($categories.Count -eq 0) { $categories = @("unclassified") }
          $lines = @($log -split "\r?\n")
          $errorIndexes = @(for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "(?i)(?:⨯|error|failed|ELIFECYCLE|cannot)") { $i }
          })
          $errorWindow = ($lines | Select-Object -Last 80) -join "`n"
          if ($errorIndexes.Count -gt 0) {
            $errorIndex = $errorIndexes[-1]
            $windowStart = [Math]::Max(0, $errorIndex - 30)
            $windowEnd = [Math]::Min($lines.Count - 1, $errorIndex + 30)
            $errorWindow = ($lines[$windowStart..$windowEnd]) -join "`n"
          }
          $componentMarkers = [ordered]@{
            "audio-runtime" = @("naudiodon2")
            "project-native" = @("src_native", "cmake-js")
            "image-runtime" = @("sharp")
            "installer" = @("makensis", "NSIS")
            "signing-runtime" = @("winCodeSign")
            "packager" = @("electron-builder", "app-builder")
            "javascript-bundler" = @("vite", "esbuild")
            "native-binary" = @(".node", "native")
          }
          $components = @()
          foreach ($entry in $componentMarkers.GetEnumerator()) {
            foreach ($marker in $entry.Value) {
              if ($errorWindow.IndexOf($marker, [StringComparison]::OrdinalIgnoreCase) -ge 0) {
                $components += $entry.Key
                break
              }
            }
          }
          if ($components.Count -eq 0) { $components = @("unknown") }
          $signatureRules = [ordered]@{
            "native-rebuild" = "gyp ERR!|@electron/rebuild|rebuild native|install-app-deps"
            "invalid-config" = "InvalidConfiguration|configuration.+(?:invalid|unknown property)|unknown property.+configuration"
            "app-entry" = "Application entry file|main file.+does not exist"
            "child-process" = "cannot execute|exit status|spawn.+(?:failed|error)"
            "archive" = "7-zip|7z.+(?:error|failed)|archive.+(?:error|failed)"
            "installer-compiler" = "makensis.+(?:error|failed)|Error in script|Internal compiler error"
            "package-size" = "file size.+(?:too large|exceed)|exceeds.+size"
            "native-module" = "native module|\.node.+(?:error|failed|not found)"
          }
          $signatures = @($signatureRules.GetEnumerator() | Where-Object { $errorWindow -match $_.Value } | ForEach-Object { $_.Key })
          if ($signatures.Count -eq 0) { $signatures = @("unknown") }
          $tokenRules = [ordered]@{
            "archive" = "archive|7-zip|7z"
            "asar" = "asar"
            "audio" = "audio|naudiodon2"
            "configure" = "configure|configuration"
            "download" = "download"
            "entry" = "entry"
            "icon" = "icon"
            "module" = "module"
            "native" = "native|\.node"
            "node-gyp" = "node-gyp|gyp ERR!"
            "nsis" = "NSIS|makensis"
            "publish" = "publish"
            "rebuild" = "rebuild"
            "resource" = "resource"
            "sign" = "sign|certificate"
            "symlink" = "symlink|symbolic link"
            "unpack" = "unpack"
            "version" = "version"
          }
          $errorTokens = @($tokenRules.GetEnumerator() | Where-Object { $errorWindow -match $_.Value } | ForEach-Object { $_.Key })
          if ($errorTokens.Count -eq 0) { $errorTokens = @("none") }
          $codes = @([regex]::Matches($errorWindow, "(?i)\b(?:ERR_[A-Z_]+|ELIFECYCLE|LNK\d{4}|MSB\d{4}|C\d{4}|E(?:PERM|ACCES|NOENT|NOSPC|TIMEDOUT|CONNRESET|CONNREFUSED)|SELF_SIGNED_CERT_IN_CHAIN|UNABLE_TO_VERIFY_LEAF_SIGNATURE|CERT_HAS_EXPIRED)\b") | ForEach-Object { $_.Value.ToUpperInvariant() } | Sort-Object -Unique)
          if ($codes.Count -eq 0) { $codes = @("none") }
          $secureWindow = ($lines | Select-Object -Last 250) -join "`n"
          if ($errorIndexes.Count -gt 0) {
            $secureWindowStart = [Math]::Max(0, $errorIndexes[-1] - 220)
            $secureWindowEnd = [Math]::Min($lines.Count - 1, $errorIndexes[-1] + 20)
            $secureWindow = ($lines[$secureWindowStart..$secureWindowEnd]) -join "`n"
          }
          $contextPath = Join-Path $env:RUNNER_TEMP "build-diagnostic-context.txt"
          $certificatePath = Join-Path $env:RUNNER_TEMP "build-diagnostic-cert.pem"
          $encryptedPath = Join-Path $env:RUNNER_TEMP "build-diagnostic-context.cms"
          $certificate = @"
          -----BEGIN CERTIFICATE-----
          MIIEJTCCAo2gAwIBAgIUQZBZq5rYj29NOabGiGFY8HFxCREwDQYJKoZIhvcNAQEL
          BQAwIjEgMB4GA1UEAwwXdGVtcG9yYXJ5LWNpLWRpYWdub3N0aWMwHhcNMjYwODE0
          MTI0NTQ0WhcNMjYwODE2MTI0NTQ0WjAiMSAwHgYDVQQDDBd0ZW1wb3JhcnktY2kt
          ZGlhZ25vc3RpYzCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCCAYoCggGBANPS1mw6
          LhH824kTja6Ul8m2JU/GtAc7XHDNZTKgMMpdgIT6m0RFet4Lm5Eitpy77YtpGzMK
          wnSIga3jBGtZ+RcLSlphCf4eKcQlwABULvnB7r/j4XB/O3Q/Q+5mr3Wff3a/mA+V
          tXemgf1uMOdZVM1M6kA4GHRdqtpfgmNd4QBANwX0BshBoXy5MYepE3VJO8Nf8kXJ
          XxbVf8b9P6J6wigCmlbOIi9g0ilYerTS3zOgR8uvRSebGGo6S0brETpTZ9b54NKu
          o1qQvaU7QY5GkvSobb6QKl3WdS8EvMiraAC/wdLaofUzZQMJCt+yELxnkoWwDP4O
          kjvY/Cu3ugxlR30WSOQHtfXhhoBcpEltcBFaF8X4I3UtgQY7CR45fqYqBpR3x8ir
          d7/wDwXfrYa5M8MQ/Yl6D0UrWTfb1xG+z7w3cdPpgxGFIfRgsRPlOT6AFszRza8D
          gJnsjHeexo//q93wYCIvUqtEtKeezKHKAVgBUVj7SYO9b2imVcoEuCjZbwIDAQAB
          o1MwUTAdBgNVHQ4EFgQUASutfYCSqTzoVg8/whSfgVx3Su8wHwYDVR0jBBgwFoAU
          ASutfYCSqTzoVg8/whSfgVx3Su8wDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0B
          AQsFAAOCAYEAq3J8uJLIvfpykR92WMtXx4re5R6l2DOGnPB9ixmSeLOt65mRBfd2
          zNmhbXYarHyaJgJpT7YWCIWTAZ2FFVMwSGimiuiorSdcrjkstJsjUcihcjf1Ccs3
          7FQsJTLaO1D0WJWW+yYXO9rkl2KjDyzDiosPoXemu3PTB0IX/4UHWEAxOS5JJpY/
          HTH94wbRNP++RI36t/oOpLouu4Feh/9An9xhnKiocceFanYyqh5jpDIGYLCDL1E2
          3S7P4BzTHLSrW6aTpxWkRR9vi5wNLOf69cwJVUy7Mk5AqA1gWYk0bMTm81GSWBGj
          fDhi37wsDRrZW6D+blf2gYLpPCMi2tYLDMTMEHLoJkhaRc426XJMWhycIYVFehw6
          5+aB8Og/Q93lHrES0LJVe2dDXiGUH8RjTkqzzCfioPh8PKbBMGsQnKBJdBkROYmY
          JaHtAjCl8B53knEyXYxIGxXvD03sJxv1dsDh/P3OF6QhsgUfJq6KdpxnQzPOItZX
          8ZFMXvZmWpnQ
          -----END CERTIFICATE-----
          "@
          Set-Content -Path $contextPath -Value $secureWindow -Encoding utf8
          Set-Content -Path $certificatePath -Value $certificate -Encoding ascii
          & openssl cms -encrypt -binary -aes256 -in $contextPath -outform DER -out $encryptedPath $certificatePath 2>$null
          $encryptedContextChunks = @("unavailable")
          if ($LASTEXITCODE -eq 0 -and (Test-Path $encryptedPath)) {
            $ciphertext = [Convert]::ToBase64String([IO.File]::ReadAllBytes($encryptedPath))
            $encryptedContextChunks = @()
            for ($offset = 0; $offset -lt $ciphertext.Length; $offset += 180) {
              $chunkLength = [Math]::Min(180, $ciphertext.Length - $offset)
              $encryptedContextChunks += $ciphertext.Substring($offset, $chunkLength)
            }
          }
          Write-Output "build-diagnostic-categories=$($categories -join ',')"
          Write-Output "build-diagnostic-components=$($components -join ',')"
          Write-Output "build-diagnostic-signatures=$($signatures -join ',')"
          Write-Output "build-diagnostic-error-tokens=$($errorTokens -join ',')"
          Write-Output "build-diagnostic-codes=$($codes -join ',')"
          foreach ($chunk in $encryptedContextChunks) {
            Write-Output "build-diagnostic-encrypted-context=$chunk"
          }

      - name: Stage release assets
        shell: pwsh
        working-directory: source
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/release-assets" | Out-Null
          Get-ChildItem -Path release -Recurse -File | Where-Object {
            $_.Name -eq "latest.yml" -or $_.Name -like "client-win-x64-*.exe" -or $_.Name -like "*.blockmap"
          } | Copy-Item -Destination "$env:RUNNER_TEMP/release-assets"

      - name: Upload release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: release-assets
          path: assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ inputs.source_ref }}
        run: gh release create "$RELEASE_REF" assets/* --title "$RELEASE_REF" --notes "Binary release." --latest
